[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synscale"
version = "0.1.0"
description = "Teacher-size effects on synthetic-data transfer to small language models: experimental pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = ["torch>=2.4", "flash-attn; platform_system=='Linux'", "datasets>=2.19", "tokenizers>=0.19", "safetensors>=0.4"]
gen = ["vllm>=0.6", "transformers>=4.44"]
eval = ["lm-eval>=0.4.5"]
analysis = ["pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9", "scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["synscale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
