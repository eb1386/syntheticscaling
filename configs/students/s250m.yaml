# Student s250m (16k BPE family, docs/07 amendment / user lock item 4).
# Derived by param_count.search_shapes(vocab=16384): total=251,705,280, non-emb=235,976,640, embedding share 6% (+0.7% of target).
# A 16k vocab (vs 32k) keeps embeddings from dominating the 25M model, so the
# student-size axis is not distorted by tokenizer overhead.
name: s250m
target_params: 250000000
n_layers: 24
d_model: 960
n_heads: 15
n_kv_heads: 5
head_dim: 64
d_ff: 2560
vocab_size: 16384
context_length: 2048
tie_embeddings: true
rope_theta: 10000.0
norm_eps: 1.0e-05
init_std: 0.02
depth_scaled_init: true
