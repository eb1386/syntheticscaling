# StudentConfig — s100m: locked shape from docs/00_locked_methodology.md §0.5.
# Exact counts (synscale/models/param_count.py convention, tied embeddings, RMSNorm gains counted):
#   total = 100,092,672   non-embedding = 75,516,672   (embedding = vocab_size * d_model = 24,576,000)
# Family rules: Llama-2 32k SentencePiece tokenizer, tied embeddings, GQA 3:1, head_dim 64,
# d_ff = 8/3 * d_model exactly, RMSNorm, RoPE theta 1e4, no biases, context 2048,
# init N(0, 0.02) with 1/sqrt(2L) residual scaling (depth_scaled_init).
name: s100m
target_params: 100000000
n_layers: 12
d_model: 768
n_heads: 12
n_kv_heads: 4
head_dim: 64
d_ff: 2048
vocab_size: 32000
context_length: 2048
tie_embeddings: true
rope_theta: 10000.0
norm_eps: 1.0e-5
init_std: 0.02
depth_scaled_init: true
activation: swiglu
norm: rmsnorm
attention_bias: false
mlp_bias: false
