# Accuracy-framing config (local5080). 16k BPE student family.
# N_tot=100,685,568 N_ne=88,102,656 base=2.0B lr=0.001208
name: train_s100m
tokenizer: bpe16k-v1
tokenizer_sha256: PENDING
context_length: 2048
precision: bf16_mixed
optimizer: adamw
checkpoint_rule: final
eval_every_tokens: 40000000
seed_base: 1
seed_phase: 1
base_phase:
  tokens: 2000000000
  batch_tokens: 524288
  lr_peak: 0.001208
  lr_min_ratio: 1.0
  schedule: wsd
  warmup_tokens: 100000000
  decay_tokens: 0
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.0
synthetic_phase:
  tokens: 800000000
  batch_tokens: 524288
  lr_peak: 0.001208
  lr_min_ratio: 0.0
  schedule: wsd
  warmup_tokens: 0
  decay_tokens: 800000000
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.25
