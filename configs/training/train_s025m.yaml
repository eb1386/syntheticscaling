# Accuracy-framing config (local5080). 16k BPE student family.
# N_tot=25,175,424 N_ne=18,883,968 base=0.5B lr=0.002238
name: train_s025m
tokenizer: bpe16k-v1
tokenizer_sha256: PENDING
context_length: 2048
precision: bf16_mixed
optimizer: adamw
checkpoint_rule: final
eval_every_tokens: 40000000
seed_base: 1
seed_phase: 1
base_phase:
  tokens: 500000000
  batch_tokens: 262144
  lr_peak: 0.002238
  lr_min_ratio: 1.0
  schedule: wsd
  warmup_tokens: 25000000
  decay_tokens: 0
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.0
synthetic_phase:
  tokens: 800000000
  batch_tokens: 262144
  lr_peak: 0.002238
  lr_min_ratio: 0.0
  schedule: wsd
  warmup_tokens: 0
  decay_tokens: 800000000
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.25
