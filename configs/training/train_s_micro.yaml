# Toy training config for CPU/CI validation only.
name: train_s_micro
tokenizer: byte-v1
tokenizer_sha256: byte-v1
context_length: 256
precision: bf16_mixed
optimizer: adamw
checkpoint_rule: final
eval_every_tokens: 8000
seed_base: 1
seed_phase: 1
base_phase:
  tokens: 200000
  batch_tokens: 4096
  lr_peak: 3.0e-3
  lr_min_ratio: 1.0
  schedule: wsd
  warmup_tokens: 8000
  decay_tokens: 0
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.0
synthetic_phase:
  tokens: 140000
  batch_tokens: 4096
  lr_peak: 3.0e-3
  lr_min_ratio: 0.0
  schedule: wsd
  warmup_tokens: 0
  decay_tokens: 140000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.25
