# Scaling-study config: base=20 tok/param (Chinchilla); fine eval cadence (~20M tok) for a dense loss-vs-D curve (docs/22).
# N_tot=251,705,280 N_ne=235,976,640 base=5.0B lr=0.000815
name: train_scaling_s250m
tokenizer: bpe16k-v1
tokenizer_sha256: PENDING
context_length: 2048
precision: bf16_mixed
optimizer: adamw
checkpoint_rule: final
eval_every_tokens: 20000000
seed_base: 1
seed_phase: 1
base_phase:
  tokens: 5000000000
  batch_tokens: 524288
  lr_peak: 0.000815
  lr_min_ratio: 1.0
  schedule: wsd
  warmup_tokens: 100000000
  decay_tokens: 0
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.0
synthetic_phase:
  tokens: 530000000
  batch_tokens: 524288
  lr_peak: 0.000815
  lr_min_ratio: 0.0
  schedule: wsd
  warmup_tokens: 0
  decay_tokens: 530000000
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  loss_mask: all_tokens
  packing: packed_masked
  replay_fraction: 0.25
